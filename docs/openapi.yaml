components:
  schemas:
    AdminPetStats:
      type: object
      properties:
        total:
          type: integer
        available:
          type: integer
        adopted:
          type: integer
        in_transit:
          type: integer
        pending:
          type: integer
      required:
      - adopted
      - available
      - in_transit
      - pending
      - total
    AdminPlatformStats:
      type: object
      properties:
        total_users:
          $ref: '#/components/schemas/AdminUserStats'
        total_pets:
          $ref: '#/components/schemas/AdminPetStats'
        active_deliveries:
          type: integer
        total_revenue_inr:
          type: number
          format: double
        average_shelter_rating:
          type: number
          format: double
        average_driver_rating:
          type: number
          format: double
      required:
      - active_deliveries
      - average_driver_rating
      - average_shelter_rating
      - total_pets
      - total_revenue_inr
      - total_users
    AdminShelterDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        user_public_id:
          type: string
          format: uuid
          readOnly: true
        user_username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        user_email:
          type: string
          format: email
          title: Email address
          readOnly: true
        user_phone:
          type: string
          readOnly: true
        organization_name:
          type: string
          maxLength: 150
        license_no:
          type: string
          maxLength: 50
        pickup_address:
          type: string
        city:
          type: string
          maxLength: 100
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        is_active:
          type: boolean
        is_verified:
          type: boolean
        verification_status:
          type: string
          readOnly: true
        pet_inventory_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - organization_name
      - pet_inventory_count
      - pickup_address
      - public_id
      - user_email
      - user_id
      - user_phone
      - user_public_id
      - user_username
      - verification_status
    AdminShelterDetailRequest:
      type: object
      properties:
        organization_name:
          type: string
          minLength: 1
          maxLength: 150
        license_no:
          type: string
          maxLength: 50
        pickup_address:
          type: string
          minLength: 1
        city:
          type: string
          maxLength: 100
