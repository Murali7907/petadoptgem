openapi: 3.0.3
info:
  title: KindHeart Pet Adoption & Logistics API
  version: 1.0.0
  description: Public Pet Discovery, Shelter Pet Management, Adoption Workflow, Real-Time
    Fleet Delivery & Tracking, and Razorpay Payments.
paths:
  /api/v1/applications/:
    get:
      operationId: applications_list
      description: |-
        ViewSet for Customer users to view their application history, submit new applications,
        and cancel pending applications.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - applications
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomerApplicationList'
          description: ''
    post:
      operationId: applications_create
      description: |-
        ViewSet for Customer users to view their application history, submit new applications,
        and cancel pending applications.
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCreate'
          description: ''
  /api/v1/applications/{public_id}/:
    get:
      operationId: applications_retrieve
      description: |-
        ViewSet for Customer users to view their application history, submit new applications,
        and cancel pending applications.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerApplication'
          description: ''
    put:
      operationId: applications_update
      description: |-
        ViewSet for Customer users to view their application history, submit new applications,
        and cancel pending applications.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerApplicationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerApplicationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerApplicationRequest'
        required: true
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerApplication'
          description: ''
    patch:
      operationId: applications_partial_update
      description: |-
        ViewSet for Customer users to view their application history, submit new applications,
        and cancel pending applications.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomerApplicationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomerApplicationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomerApplicationRequest'
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerApplication'
          description: ''
  /api/v1/applications/{public_id}/cancel/:
    post:
      operationId: applications_cancel_create
      description: |-
        ViewSet for Customer users to view their application history, submit new applications,
        and cancel pending applications.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerApplicationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerApplicationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerApplicationRequest'
        required: true
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerApplication'
          description: ''
  /api/v1/applications/{public_id}/review/:
    post:
      operationId: applications_review_create
      description: |-
        POST /api/v1/adoptions/applications/<uuid:public_id>/review/
        Allows customer applicant to submit a dual review once delivery is completed.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptionReviewCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdoptionReviewCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdoptionReviewCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptionReviewCreate'
          description: ''
  /api/v1/auth/admin/dashboard/stats/:
    get:
      operationId: auth_admin_dashboard_stats_retrieve
      description: Returns aggregate metrics across users, pet catalog, active delivery
        fleet, revenue, and satisfaction ratings.
      summary: Platform Admin Dashboard Statistics
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlatformStats'
          description: ''
  /api/v1/auth/admin/shelters/:
    get:
      operationId: auth_admin_shelters_list
      description: Admin ViewSet for oversight, verification, and suspension of shelter
        profiles.
      summary: List all shelters for admin oversight
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminShelterDetailList'
          description: ''
    post:
      operationId: auth_admin_shelters_create
      description: Admin ViewSet for oversight, verification, and suspension of shelter
        profiles.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminShelterDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminShelterDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminShelterDetailRequest'
        required: true
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminShelterDetail'
          description: ''
  /api/v1/auth/admin/shelters/{public_id}/:
    get:
      operationId: auth_admin_shelters_retrieve
      description: Admin ViewSet for oversight, verification, and suspension of shelter
        profiles.
      summary: Retrieve full shelter detail including verification and inventory
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminShelterDetail'
          description: ''
    put:
      operationId: auth_admin_shelters_update
      description: Admin ViewSet for oversight, verification, and suspension of shelter
        profiles.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminShelterDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminShelterDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminShelterDetailRequest'
        required: true
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminShelterDetail'
          description: ''
    patch:
      operationId: auth_admin_shelters_partial_update
      description: Admin ViewSet for oversight, verification, and suspension of shelter
        profiles.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminShelterDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminShelterDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminShelterDetailRequest'
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminShelterDetail'
          description: ''
    delete:
      operationId: auth_admin_shelters_destroy
      description: Admin ViewSet for oversight, verification, and suspension of shelter
        profiles.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/admin/shelters/{public_id}/suspend/:
    post:
      operationId: auth_admin_shelters_suspend_create
      description: Admin ViewSet for oversight, verification, and suspension of shelter
        profiles.
      summary: Suspend a shelter profile
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminShelterDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminShelterDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminShelterDetailRequest'
        required: true
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminShelterDetail'
          description: ''
  /api/v1/auth/admin/shelters/{public_id}/verify/:
    post:
      operationId: auth_admin_shelters_verify_create
      description: Admin ViewSet for oversight, verification, and suspension of shelter
        profiles.
      summary: Approve and verify a shelter
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminShelterDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminShelterDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminShelterDetailRequest'
        required: true
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminShelterDetail'
          description: ''
  /api/v1/auth/drivers/create/:
    post:
      operationId: auth_drivers_create_create
      description: |-
        Dedicated Fleets: Delivery partners belong strictly to a single shelter.
        Drivers cannot self-register; they are created by their shelter.
        POST /api/auth/drivers/create/
      summary: Create a new delivery driver for shelter fleet
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DriverCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DriverCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Login endpoint returning access and refresh JWT tokens with custom embedded role claims.
        Throttled per IP via auth_login scope.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      security:
      - jwt_auth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the provided refresh token. Logging out twice is harmless.
      summary: Logout and blacklist refresh token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - jwt_auth: []
      - {}
      responses:
        '200':
          description: Successfully logged out
        '400':
          description: Missing or invalid token
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Endpoint returning authenticated user profile and identity.
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/notifications/:
    get:
      operationId: auth_notifications_list
      description: List all notifications for the authenticated user, optionally filtered
        by ?unread=true.
      summary: List user notifications
      parameters:
      - in: query
        name: unread
        schema:
          type: boolean
        description: Filter unread notifications only
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/auth/notifications/{public_id}/read/:
    post:
      operationId: auth_notifications_read_create
      description: Mark a specific notification as read by public_id.
      summary: Mark notification as read
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/auth/notifications/read-all/:
    post:
      operationId: auth_notifications_read_all_create
      description: Mark all notifications for the authenticated user as read.
      summary: Mark all notifications as read
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        User registration endpoint open to all applicants.
        Throttled per IP via auth_register scope.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - jwt_auth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistration'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Token refresh endpoint generating new access token from refresh token.
        Throttled per IP via auth_refresh scope.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      security:
      - jwt_auth: []
      responses:
        '200':
          description: No response body
  /api/v1/customer/favorites/:
    get:
      operationId: customer_favorites_list
      description: Retrieve all pets saved to favorites by the authenticated customer.
      summary: List customer favorite pets
      tags:
      - customer
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetSummary'
          description: ''
  /api/v1/customer/favorites/{pet_public_id}/:
    post:
      operationId: customer_favorites_create
      description: Toggle favorite status or explicitly add pet to customer favorites.
      summary: Toggle or add pet to favorites
      parameters:
      - in: path
        name: pet_public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - customer
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: customer_favorites_destroy
      description: Remove a pet from the customer's favorites by public_id.
      summary: Remove pet from favorites
      parameters:
      - in: path
        name: pet_public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - customer
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/delivery/reviews/:
    get:
      operationId: delivery_reviews_retrieve
      description: |-
        GET /api/v1/delivery/reviews/
        Lists all reviews for the authenticated driver, including average rating.
      tags:
      - delivery
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptionReviewDetail'
          description: ''
  /api/v1/delivery/tasks/{public_id}/collect-cash/:
    post:
      operationId: delivery_tasks_collect_cash_create
      description: |-
        Endpoints for delivery drivers and tracking.
        - GET  /api/v1/delivery/tasks/active/ or GET /api/deliveries/driver-active/
        - POST /api/v1/delivery/tasks/<id>/pickup/
        - POST /api/v1/delivery/tasks/<id>/verify-doorstep/ or POST /api/deliveries/<id>/verify-otp/
        - POST /api/v1/delivery/tasks/<id>/ping/ or POST /api/deliveries/<id>/ping/
        - GET  /api/v1/delivery/tasks/<id>/tracking/ or GET /api/deliveries/<id>/track/
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - delivery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectCashRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CollectCashRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CollectCashRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - jwt_auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectCashResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/delivery/tasks/{public_id}/pickup/:
    post:
      operationId: delivery_tasks_pickup_create
      description: |-
        Endpoints for delivery drivers and tracking.
        - GET  /api/v1/delivery/tasks/active/ or GET /api/deliveries/driver-active/
        - POST /api/v1/delivery/tasks/<id>/pickup/
        - POST /api/v1/delivery/tasks/<id>/verify-doorstep/ or POST /api/deliveries/<id>/verify-otp/
        - POST /api/v1/delivery/tasks/<id>/ping/ or POST /api/deliveries/<id>/ping/
        - GET  /api/v1/delivery/tasks/<id>/tracking/ or GET /api/deliveries/<id>/track/
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - delivery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
